<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS ZA - Products</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body,
        .new-arrival-text,
        .see-all-text {
            font-family: "Andika", sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <nav class="px-4 md:px-8 bg-[#F5EDFF] py-3 sticky top-0 z-50 shadow-sm">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <span class="logo text-lg sm:text-xl font-bold cursor-pointer"><a href="index.html">OS ZA<sup>&#174;</sup></a></span>

            <ul class="list hidden md:flex items-center gap-7">
                <li class="list-items cursor-pointer hover:scale-105 transition"><a href="index.html" class="nav-links">Home</a></li>
                <li class="list-items cursor-pointer hover:scale-105 transition"><a href="products.html" class="nav-links font-semibold">Products</a></li>
                <li class="list-items cursor-pointer hover:scale-105 transition"><a href="category.html" class="nav-links">Categories</a></li>
            </ul>

            <div class="text flex gap-4 items-center">
                <a href="wishlist.html" title="Wishlist">
                    <img src="images/heart.svg" class="h-6 w-7 sm:h-7 sm:w-8 hover:scale-110 transition">
                </a> 
                <a href="checkout.html" title="Cart">
                    <img src="images/cart-img.svg" class="h-6 w-7 sm:h-7 sm:w-8 hover:scale-110 transition">
                </a>
                <button id="menuToggle" onclick="toggleMobileMenu()" class="md:hidden text-2xl text-gray-800 focus:outline-none ml-2" aria-label="Toggle Navigation">
                    <i class="fa-solid fa-bars" id="menuIcon"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Nav Drawer -->
        <div id="mobileMenu" class="hidden md:hidden absolute top-full left-0 w-full bg-[#F5EDFF] border-b border-purple-200 shadow-xl px-6 py-4 flex flex-col gap-4 z-50">
            <a href="index.html" class="font-semibold text-base py-1 border-b border-purple-200">Home</a>
            <a href="products.html" class="font-semibold text-base py-1 border-b border-purple-200">Products</a>
            <a href="category.html" class="font-semibold text-base py-1 border-b border-purple-200">Categories</a>
            <a href="wishlist.html" class="font-semibold text-base py-1 border-b border-purple-200">Wishlist</a>
            <a href="checkout.html" class="font-semibold text-base py-1">Cart</a>
        </div>
    </nav>

    <div class="main w-full max-w-7xl mx-auto flex flex-col md:flex-row min-h-screen">
        <!-- Mobile Filter Button -->
        <div class="md:hidden p-4 bg-white border-b flex justify-between items-center sticky top-[57px] z-40">
            <h2 class="font-bold text-lg">Catalog</h2>
            <button onclick="toggleMobileFilter()" class="flex items-center gap-2 bg-[#F5EDFF] border border-purple-200 px-4 py-2 rounded-lg font-medium text-sm text-purple-900">
                <i class="fa-solid fa-sliders"></i> Filters
            </button>
        </div>

        <!-- Sidebar / Filters -->
        <aside id="filterSidebar" class="hidden md:block w-full md:w-64 bg-[#F5EDFF] p-6 border-r border-purple-100 flex-shrink-0">
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-4 hidden md:block">Filter By</h2>
                <input type="text" placeholder="Search..." id="search"
                    class="w-full bg-white border border-purple-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-purple-600 shadow-sm">
            </div>

            <div class="pb-6 border-b border-purple-200">
                <h3 class="font-semibold mb-3 text-gray-800">Category</h3>

                <div class="space-y-2.5 text-sm text-gray-700">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" class="category accent-purple-600" value="All Products">
                        <span>All Products</span>
                    </label>

                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" class="category accent-purple-600" value="Beauty & Personal Care">
                        <span>Beauty & Personal Care</span>
                    </label>

                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" class="category accent-purple-600" value="Health & Fitness">
                        <span>Health & Fitness</span>
                    </label>

                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" class="category accent-purple-600" value="Home & Kitchen">
                        <span>Home & Kitchen</span>
                    </label>

                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" class="category accent-purple-600" value="Electronics & Gadgets">
                        <span>Electronics & Gadgets</span>
                    </label>
                </div>
            </div>

            <div class="py-6">
                <h3 class="font-semibold mb-3 text-gray-800">Price</h3>

                <input
                    type="range"
                    id="priceRange"
                    class="w-full accent-purple-600 cursor-pointer"
                    min="0"
                    max="500"
                    value="500">
                <div class="flex justify-between mt-2 text-sm font-medium text-gray-600">
                    <span>$0</span>
                    <span id="pricevalue">$500</span>
                </div>
            </div>
        </aside>

        <!-- Right Side Products Content -->
        <div class="right-products w-full md:flex-1 p-4 sm:p-6">
            <div class="sorting-products mb-6">
                <div class="flex justify-between sm:justify-end items-center gap-4">
                    <span class="text-sm font-medium text-gray-600 sm:hidden">Products catalog</span>
                    <div class="flex items-center gap-3">
                        <label for="sort" class="font-medium text-gray-700 text-sm">
                            Sort By
                        </label>

                        <select id="sort" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-purple-600 bg-white shadow-sm">
                            <option value="">Default</option>
                            <option>Price: Low to High</option>
                            <option>Price: High to Low</option>
                            <option>A-Z</option>
                            <option>Z-A</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="product-display grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <footer class="bg-[#F5EDFF] text-gray-800 py-12 px-4 border-t border-purple-100">
        <div class="max-w-5xl mx-auto flex flex-col items-center gap-8">
            <ul class="flex flex-wrap justify-center gap-6 sm:gap-10 font-medium">
                <li><a href="index.html" class="hover:text-purple-600 transition">Home</a></li>
                <li><a href="products.html" class="hover:text-purple-600 transition">Products</a></li>
                <li><a href="category.html" class="hover:text-purple-600 transition">Categories</a></li>
                <li><a href="checkout.html" class="hover:text-purple-600 transition">Cart</a></li>
                <li><a href="wishlist.html" class="hover:text-purple-600 transition">Wishlist</a></li>
            </ul>

            <div class="flex gap-8 text-xl">
                <a href="#" class="hover:text-purple-600 transition"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="hover:text-purple-600 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="hover:text-purple-600 transition"><i class="fa-brands fa-youtube"></i></a>
            </div>
            <p class="text-sm text-gray-600 text-center">&copy; 2026 OS ZA, Inc. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/scripts.js"></script>
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById("mobileMenu");
            const icon = document.getElementById("menuIcon");
            if (menu.classList.contains("hidden")) {
                menu.classList.remove("hidden");
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-xmark");
            } else {
                menu.classList.add("hidden");
                icon.classList.remove("fa-xmark");
                icon.classList.add("fa-bars");
            }
        }

        function toggleMobileFilter() {
            const sidebar = document.getElementById("filterSidebar");
            sidebar.classList.toggle("hidden");
        }
    </script>
</body>

</html>
