<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F5EDFF] flex justify-center items-center min-h-screen">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md mx-4 border border-purple-100">
        <h2 class="text-3xl font-bold text-center mb-6 text-gray-900">Login</h2>

        <form>
            <!-- Email -->
            <div class="mb-4">
                <label class="block mb-2 text-sm font-medium text-gray-700">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600"
                >
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block mb-2 text-sm font-medium text-gray-700">Password</label>
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600"
                >
            </div>

            <!-- Button -->
            <button
                type="button"
                onclick="login()"
                class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 font-semibold transition text-sm shadow-sm"
            >
                Login
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-gray-600">
            Don't have an account?
            <a href="signup.html" class="text-purple-600 hover:underline font-semibold">Sign Up</a>
        </p>
    </div>
<script src="scripts/auth.js"></script>
</body>
</html>
