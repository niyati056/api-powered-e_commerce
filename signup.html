<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS ZA - Create Account</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap');

        body {
            font-family: "Andika", sans-serif;
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#F5EDFF] flex flex-col justify-between items-center min-h-screen p-4 antialiased selection:bg-purple-200 selection:text-purple-900">

    <!-- Top mini header -->
    <header class="w-full max-w-md mx-auto pt-4 flex justify-between items-center">
        <span class="logo text-xl sm:text-2xl font-black tracking-tight cursor-pointer">
            <a href="index.html" class="hover:opacity-90 transition">OS ZA<sup class="text-xs font-normal">&#174;</sup></a>
        </span>
        <a href="index.html" class="text-xs font-semibold text-purple-700 hover:text-purple-900 flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span>Back to Store</span>
        </a>
    </header>

    <div class="bg-white p-7 sm:p-9 rounded-3xl shadow-xl w-full max-w-md my-6 border border-purple-100">

        <div class="text-center mb-6">
            <span class="text-xs font-bold uppercase tracking-widest text-purple-700 bg-[#F5EDFF] px-3 py-1 rounded-full">New Member</span>
            <h1 class="text-2xl sm:text-3xl font-black text-gray-900 mt-2">Create Account</h1>
            <p class="text-xs text-gray-500 mt-1">Join OS ZA for fast checkouts & exclusive perks.</p>
        </div>

        <form onsubmit="event.preventDefault(); signup();" class="space-y-4">

            <!-- Full Name -->
            <div>
                <label class="block mb-1.5 text-xs font-bold text-gray-700 uppercase tracking-wider">Full Name</label>
                <div class="relative">
                    <input
                        id="name"
                        type="text"
                        placeholder="e.g. Alex Morgan"
                        required
                        class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition"
                    >
                    <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block mb-1.5 text-xs font-bold text-gray-700 uppercase tracking-wider">Email Address</label>
                <div class="relative">
                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                        class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition"
                    >
                    <i class="fa-regular fa-envelope absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block mb-1.5 text-xs font-bold text-gray-700 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        placeholder="At least 6 characters"
                        required
                        class="w-full border border-gray-300 rounded-xl pl-10 pr-10 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition"
                    >
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                    <button type="button" onclick="togglePasswordVisibility('password', 'eyeIcon1')" class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 text-sm cursor-pointer">
                        <i id="eyeIcon1" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block mb-1.5 text-xs font-bold text-gray-700 uppercase tracking-wider">Confirm Password</label>
                <div class="relative">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter password"
                        required
                        class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition"
                    >
                    <i class="fa-solid fa-shield-halved absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                </div>
            </div>

            <!-- Sign Up Button -->
            <button
                type="submit"
                class="w-full bg-black text-white py-3 rounded-xl hover:bg-gray-800 font-bold transition text-sm shadow-xs mt-2 cursor-pointer flex justify-center items-center gap-2">
                <span>Create Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>

        </form>

        <p class="text-center mt-6 text-xs text-gray-600">
            Already have an account?
            <a href="login.html" class="text-purple-700 hover:underline font-bold ml-1">
                Log in here &rarr;
            </a>
        </p>

    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-500 pb-4">
        &copy; 2026 OS ZA, Inc. All rights reserved.
    </footer>

    <script src="scripts/auth.js"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>

</html>
