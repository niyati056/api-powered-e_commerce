<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS ZA - My Wishlist</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body,
        .new-arrival-text,
        .see-all-text {
            font-family: "Andika", sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">
    <nav class="px-4 md:px-8 bg-[#F5EDFF] py-3 sticky top-0 z-50 shadow-sm">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <span class="logo text-lg sm:text-xl font-bold cursor-pointer"><a href="index.html">OS ZA<sup>&#174;</sup></a></span>

            <ul class="list hidden md:flex items-center gap-7">
                <li class="list-items cursor-pointer hover:scale-105 transition"><a href="index.html" class="nav-links">Home</a></li>
                <li class="list-items cursor-pointer hover:scale-105 transition"><a href="products.html" class="nav-links">Products</a></li>
                <li class="list-items cursor-pointer hover:scale-105 transition"><a href="category.html" class="nav-links">Categories</a></li>
            </ul>

            <div class="text flex gap-4 items-center">
                <a href="wishlist.html" title="Wishlist">
                    <img src="images/heart.svg" class="h-6 w-7 sm:h-7 sm:w-8 hover:scale-110 transition">
                </a> 
                <a href="checkout.html" title="Cart">
                    <img src="images/cart-img.svg" class="h-6 w-7 sm:h-7 sm:w-8 hover:scale-110 transition">
                </a>
                <button id="menuToggle" onclick="toggleMobileMenu()" class="md:hidden text-2xl text-gray-800 focus:outline-none ml-2" aria-label="Toggle Navigation">
                    <i class="fa-solid fa-bars" id="menuIcon"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Nav Drawer -->
        <div id="mobileMenu" class="hidden md:hidden absolute top-full left-0 w-full bg-[#F5EDFF] border-b border-purple-200 shadow-xl px-6 py-4 flex flex-col gap-4 z-50">
            <a href="index.html" class="font-semibold text-base py-1 border-b border-purple-200">Home</a>
            <a href="products.html" class="font-semibold text-base py-1 border-b border-purple-200">Products</a>
            <a href="category.html" class="font-semibold text-base py-1 border-b border-purple-200">Categories</a>
            <a href="wishlist.html" class="font-semibold text-base py-1 border-b border-purple-200">Wishlist</a>
            <a href="checkout.html" class="font-semibold text-base py-1">Cart</a>
        </div>
    </nav>
    

    <section class="px-4 sm:px-8 py-8 sm:py-10 max-w-7xl mx-auto w-full flex-1">

        <!-- Heading -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl sm:text-4xl font-bold">My Wishlist</h1>
                <p class="text-gray-600 text-sm sm:text-base mt-1">
                    Save your favorite products for later.
                </p>
            </div>

            <a href="products.html" class="px-5 py-2.5 bg-[#F5EDFF] rounded-xl hover:bg-[#eadcff] font-medium text-sm transition border border-purple-200">
                Continue Shopping
            </a>
        </div>

        <!-- Wishlist Products Grid -->
        <div class="product-display grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    </section>

    <footer class="bg-[#F5EDFF] text-gray-800 py-12 px-4 border-t border-purple-100 mt-12">
        <div class="max-w-5xl mx-auto flex flex-col items-center gap-8">
            <ul class="flex flex-wrap justify-center gap-6 sm:gap-10 font-medium">
                <li><a href="index.html" class="hover:text-purple-600 transition">Home</a></li>
                <li><a href="products.html" class="hover:text-purple-600 transition">Products</a></li>
                <li><a href="category.html" class="hover:text-purple-600 transition">Categories</a></li>
                <li><a href="checkout.html" class="hover:text-purple-600 transition">Cart</a></li>
                <li><a href="wishlist.html" class="hover:text-purple-600 transition">Wishlist</a></li>
            </ul>

            <div class="flex gap-8 text-xl">
                <a href="#" class="hover:text-purple-600 transition"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="hover:text-purple-600 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="hover:text-purple-600 transition"><i class="fa-brands fa-youtube"></i></a>
            </div>
            <p class="text-sm text-gray-600 text-center">&copy; 2026 OS ZA, Inc. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/whishlist.js"></script>
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById("mobileMenu");
            const icon = document.getElementById("menuIcon");
            if (menu.classList.contains("hidden")) {
                menu.classList.remove("hidden");
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-xmark");
            } else {
                menu.classList.add("hidden");
                icon.classList.remove("fa-xmark");
                icon.classList.add("fa-bars");
            }
        }
    </script>
</body>

</html>
