<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS ZA AI Assistant</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10 bg-white rounded-xl shadow-lg overflow-hidden">

    <div class="bg-indigo-600 text-white text-xl font-bold p-4">
        OS ZA AI Shopping Assistant
    </div>

    <div id="chatBox" class="h-[500px] overflow-y-auto p-5 space-y-4">

    </div>

    <div class="flex border-t">

        <input
            id="userInput"
            type="text"
            placeholder="Ask anything..."
            class="flex-1 p-4 outline-none">

        <button
            onclick="sendMessage()"
            class="bg-indigo-600 text-white px-8">
            Send
        </button>

    </div>

</div>

<script>

    fetch("https://generativelanguage.googleapis.com/v1beta/models", {
    headers: {
        "x-goog-api-key": "AIzaSyBJe4Lvwb1u0N8Mkwql1sY_51VD1mW1Xq0"
    }
})
.then(res => res.json())
.then(data => console.log(data));

const API_KEY = "AIzaSyBJe4Lvwb1u0N8Mkwql1sY_51VD1mW1Xq0";

const PRODUCT_API = "https://kolzsticks.github.io/Free-Ecommerce-Products-Api/main/products.json";

let products=[];

async function loadProducts(){

    const response=await fetch(PRODUCT_API);

    products=await response.json();

}

loadProducts();

async function sendMessage(){

    const input=document.getElementById("userInput");

    const message=input.value.trim();

    if(message==="") return;

    addMessage(message,"user");

    input.value="";

    const prompt=`

You are an AI shopping assistant for an ecommerce website named OS ZA.

Only answer using the following products.

Products:

${JSON.stringify(products)}

Customer Question:

${message}

Rules:

1. Recommend products only from the list.
2. Mention price.
3. Mention category.
4. If product doesn't exist say:
"Sorry, we don't have that product."

`;

    const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            contents:[
                {
                    parts:[
                        {
                            text:prompt
                        }
                    ]
                }
            ]

        })

    });

    const data=await response.json();

    const reply=data.candidates[0].content.parts[0].text;

    addMessage(reply,"bot");

}

function addMessage(text,type){

    const chat=document.getElementById("chatBox");

    const div=document.createElement("div");

    if(type==="user"){

        div.className="bg-indigo-600 text-white p-3 rounded-lg ml-auto max-w-[70%]";

    }

    else{

        div.className="bg-gray-200 p-3 rounded-lg mr-auto max-w-[70%]";

    }

    div.innerText=text;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

}

</script>

</body>
</html>
