<!DOCTYPE html>
<html>

<head>

<title>Order Success</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="flex justify-center items-center h-screen  bg-[#F5EDFF]">

<div class="bg-white shadow-lg rounded-lg p-8 text-center">

<h1 class="text-3xl font-bold text-green-600">
Order Placed Successfully
</h1>

<p class="mt-5 text-lg ">
Your Order ID
</p>

<h2 id="orderid"
class="text-2xl font-bold mt-3 text-black"></h2>

<a href="index.html"
class="inline-block mt-6 bg-black text-white px-6 py-3 rounded-lg">
Continue Shopping
</a>

</div>

<script>

const order = JSON.parse(localStorage.getItem("lastOrder"));

document.getElementById("orderid").innerText = order.orderID;

</script>

</body>

</html>
